version: '3.8'

services:
  frontend:
    build: .
    container_name: manufacturing-tracking-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000/api
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

# To use:
# docker-compose up -d
# Visit http://localhost:5173
#
# Stop:
# docker-compose down
